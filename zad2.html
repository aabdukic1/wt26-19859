<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervacija termina - Radionica pripreme kafe</title>
</head>
<body style="
    font-family: Arial, sans-serif;
    background-color: #fef3c7;
    color: #1c1917;
    padding: 30px 15px;
    margin: 0;
">

    
    <div style="
        max-width: 500px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 25px;
        border-radius: 8px;
        border-top: 5px solid #78350f;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    ">
        <h2 style="color: #78350f; margin-top: 0; margin-bottom: 8px;">Rezervacija radionice kafe ☕</h2>
        <p style="color: #78350f; font-size: 15px; margin-bottom: 20px;">Popunite formu ispod kako biste rezervisali vaše mjesto na praktičnoj radionici.</p>

        <form action="#" method="post" onsubmit="event.preventDefault(); alert('Rezervacija je evidentirana u demonstracijskom modu!');">
            
            
            <p style="margin-bottom: 15px;">
                <label for="ime-prezime" style="font-weight: bold; display: block; margin-bottom: 5px;">Ime i prezime:</label>
                <input type="text" id="ime-prezime" name="ime_prezime" placeholder="npr. Nejra Hadžić" required style="
                    width: 100%;
                    padding: 8px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    box-sizing: border-box;
                ">
            </p>

            
            <p style="margin-bottom: 15px;">
                <label for="email" style="font-weight: bold; display: block; margin-bottom: 5px;">E-mail adresa:</label>
                <input type="email" id="email" name="email" placeholder="vaša.adresa@email.com" required style="
                    width: 100%;
                    padding: 8px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    box-sizing: border-box;
                ">
            </p>

          
            <p style="margin-bottom: 15px;">
                <label for="termin" style="font-weight: bold; display: block; margin-bottom: 5px;">Odaberite željeni termin radionice:</label>
                <select id="termin" name="termin" required style="
                    width: 100%;
                    padding: 8px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    box-sizing: border-box;
                ">
                    <option value="" disabled selected>-- Odaberite termin --</option>
                    <option value="petak-18">Petak, 18:00h - 20:00h</option>
                    <option value="subota-12">Subota, 12:00h - 14:00h</option>
                    <option value="subota-17">Subota, 17:00h - 19:00h</option>
                    <option value="nedjelja-11">Nedjelja, 11:00h - 13:00h</option>
                </select>
            </p>

           
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Koje vrste kafe vas najviše zanimaju? (moguće više izbora):</label>
                
                <label style="display: block; margin-bottom: 6px; cursor: pointer;">
                    <input type="checkbox" name="interesi" value="espresso"> Espresso i mliječni napici (Cappuccino, Latte)
                </label>
                
                <label style="display: block; margin-bottom: 6px; cursor: pointer;">
                    <input type="checkbox" name="interesi" value="tradicionalna"> Tradicionalna / Turska kafa
                </label>

                <label style="display: block; margin-bottom: 6px; cursor: pointer;">
                    <input type="checkbox" name="interesi" value="filter"> Filter kafa (V60, Chemex, Aeropress)
                </label>

                <label style="display: block; margin-bottom: 6px; cursor: pointer;">
                    <input type="checkbox" name="interesi" value="coldbrew"> Cold Brew / Hladno pripremljena kafa
                </label>
            </div>

           
            <button type="submit" style="
                background-color: #78350f;
                color: white;
                border: none;
                padding: 10px 15px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 5px;
                cursor: pointer;
                width: 100%;
            ">Potvrdi rezervaciju</button>

        </form>
    </div>

</body>
</html>
